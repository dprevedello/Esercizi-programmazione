<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrazione</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Registrati</h1>

  <form id="modulo" novalidate>
    <label for="username">Nome utente</label>
    <input type="text" id="username">
    <span class="errore" id="errore-username"></span>

    <label for="email">Email</label>
    <input type="text" id="email">
    <span class="errore" id="errore-email"></span>

    <label for="password">Password</label>
    <input type="password" id="password">
    <span class="errore" id="errore-password"></span>

    <label for="conferma">Conferma password</label>
    <input type="password" id="conferma">
    <span class="errore" id="errore-conferma"></span>

    <div class="regolamento">
      <input type="checkbox" id="regolamento">
      <label for="regolamento">Accetto il regolamento</label>
    </div>
    <span class="errore" id="errore-regolamento"></span>

    <button type="submit">Registrati</button>
  </form>

  <p id="esito"></p>

  <script src="script.js"></script>
</body>
</html>
