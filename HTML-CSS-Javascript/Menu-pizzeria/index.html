<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Menu pizzeria</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Pizzeria Da Marco</h1>

  <div class="menu">
    <section class="categoria antipasti">
      <h2>Antipasti</h2>
      <ul>
        <li>Bruschette al pomodoro <span class="prezzo">€5</span></li>
        <li>Tagliere di salumi <span class="prezzo">€8</span></li>
      </ul>
    </section>

    <section class="categoria primi">
      <h2>Primi piatti</h2>
      <ul>
        <li>Risotto ai funghi <span class="prezzo">€9</span></li>
        <li>Pasta al pomodoro <span class="prezzo">€7</span></li>
      </ul>
    </section>

    <section class="categoria pizze">
      <h2>Pizze</h2>
      <ul>
        <li>Margherita <span class="prezzo">€6</span></li>
        <li>Diavola <span class="prezzo">€8</span></li>
      </ul>
    </section>
  </div>

  <h3>Informazioni sul servizio</h3>
  <p class="nota">Il coperto (<span class="prezzo">€1,50</span>) non è incluso nei prezzi indicati.</p>
</body>
</html>
