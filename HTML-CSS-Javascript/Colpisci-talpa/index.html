<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colpisci la talpa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Colpisci la talpa</h1>

  <p class="dati">Punti: <span id="punti">0</span> &nbsp;&nbsp; Tempo: <span id="tempo">30</span></p>

  <div class="campo">
    <button class="buca" onclick="colpisci(0)"></button>
    <button class="buca" onclick="colpisci(1)"></button>
    <button class="buca" onclick="colpisci(2)"></button>
    <button class="buca" onclick="colpisci(3)"></button>
    <button class="buca" onclick="colpisci(4)"></button>
    <button class="buca" onclick="colpisci(5)"></button>
    <button class="buca" onclick="colpisci(6)"></button>
    <button class="buca" onclick="colpisci(7)"></button>
    <button class="buca" onclick="colpisci(8)"></button>
  </div>

  <p id="esito"></p>
  <button id="inizia">Inizia</button>

  <script src="script.js"></script>
</body>
</html>
