<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Contattaci</title>
</head>
<body>
  <h1>Contattaci</h1>

  <form>
    <label for="nome">Nome</label>

    <button type="submit">Invia</button>
  </form>

</html>
