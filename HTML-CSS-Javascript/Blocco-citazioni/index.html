<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Blocco citazioni</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <blockquote class="citazione">
    Il modo migliore per imparare a programmare è programmare.
    <footer class="autore">— Anonimo</footer>
  </blockquote>

  <blockquote class="citazione">
    Un buon codice si commenta da solo, ma un buon commento non fa mai male.
    <footer class="autore">— Anonimo</footer>
  </blockquote>
</body>
</html>
