<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indovina il numero</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Indovina il numero</h1>
  <p>Ho pensato un numero da 1 a 100. Riesci a indovinarlo?</p>

  <input type="number" id="tentativo" min="1" max="100">
  <button id="prova">Prova</button>

  <p id="suggerimento"></p>
  <p>Tentativi: <span id="tentativi">0</span></p>

  <button id="nuova">Nuova partita</button>

  <script src="script.js"></script>
</body>
</html>
