<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Commodore 64 vs Apple II</title>
</head>
<body>
  <h1>Commodore 64 vs Apple II</h1>

  <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Commodore-64-Computer-FL.jpg"
       alt="Fotografia di un computer Commodore 64 con tastiera integrata"
       width="300">

  <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Apple-II.jpg"
       alt="Fotografia di un computer Apple II con tastiera integrata e monitor"
       width="300">

  <table>
    <thead>
      <tr>
        <th>Caratteristica</th>
        <th>Commodore 64</th>
        <th>Apple II</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Anno di uscita</td>
        <td>1982</td>
        <td>1977</td>
      </tr>
      <tr>
        <td>CPU</td>
        <td>MOS 6510</td>
        <td>MOS 6502</td>
      </tr>
      <tr>
        <td>RAM</td>
        <td>64 KB</td>
        <td>4-48 KB</td>
      </tr>
      <tr>
        <td>Prezzo di lancio</td>
        <td>595 $</td>
        <td>1298 $</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
